<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Niệm Phật Online</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Serif:wght@400;700&display=swap">
<style>
/* Layout: cảnh 3D toàn màn hình; góc trái trên là hồ sơ, phải trên là công đức, cột nút tu tập bên phải, thanh chức năng dưới cùng, bảng trượt từ dưới lên */
:root{
  --bg:#120d0b;
  --paper:#f3e9d2;
  --gold:#e0b04c;
  --gold-d:#b98428;
  --lac:#8f241b;
  --jade:#5fa59a;
  --mist:#b9b3c4;
  --glass:rgba(22,14,11,.78);
  --glass2:rgba(34,22,17,.92);
  --line:rgba(224,176,76,.38);
  --display:'Noto Serif','Times New Roman',serif;
  --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--paper);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#stage{position:fixed;inset:0;background:var(--bg)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;transform-origin:50% 100%;text-align:center;white-space:nowrap;font:600 12px/1.15 var(--body);text-shadow:0 1px 3px #000,0 0 6px #000;will-change:transform}
.lab small{display:block;font:500 10px var(--body);opacity:.8}
.lab.me{color:var(--gold)}
.lab.real{color:#ffe7a3}
.lab.bub{background:var(--glass2);border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-weight:500}
.fl{position:absolute;left:0;top:0;font:700 14px var(--display);color:var(--gold);text-shadow:0 1px 4px #000;white-space:nowrap}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;
  padding-block:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-bottom,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.ui button,.panel,.extHud{pointer-events:auto}
.hud{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hudL{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.prof{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer;max-width:min(300px,64vw)}
.pav{flex:none;width:36px;height:36px;border-radius:50%;background:linear-gradient(160deg,#f3a8b8,#c8567a);display:grid;place-items:center;color:#fff}
.pt{display:flex;flex-direction:column;align-items:flex-start;min-width:0;line-height:1.2}
.pt b{font:600 14px var(--body);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt small{font:500 11px var(--body);color:var(--gold)}
.coin{font:600 12px var(--body);color:var(--paper);background:rgba(224,176,76,.18);border-radius:999px;padding:3px 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tname{font:700 clamp(18px,5vw,24px)/1.1 var(--display);text-shadow:0 2px 8px #000;overflow-wrap:anywhere}
.online{font:500 12px var(--body);text-shadow:0 1px 4px #000;color:#d9f2d0}
.btn{font:500 13px var(--body);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.merit{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:6px 12px;text-align:right;line-height:1.1}
.merit small{display:block;font:500 11px var(--body);color:var(--gold)}
.merit b{font:700 20px var(--display);font-variant-numeric:tabular-nums}
.ticker{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top,0px)) + 208px);max-width:min(560px,92vw);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font:500 12px var(--body);text-align:center;pointer-events:none;z-index:2}
.acts{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:auto;bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 62px);display:flex;flex-direction:column;gap:6px}
.act .badge{position:absolute;top:2px;right:2px;margin:0}.act{position:relative;width:58px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;background:var(--glass);border:1px solid var(--line);border-radius:14px;cursor:pointer;font:500 11px var(--body);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.act:active,.mi:active{transform:scale(.95);background:rgba(224,176,76,.2)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mi.gold{background:linear-gradient(180deg,#f3d27a,#c8922f);color:#2a1706;border-color:#f3d27a}.mi.gold .ic{stroke:#2a1706}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:2px 0 7px;width:100%;max-width:560px;margin:0 auto}
.menu .mi{justify-content:center;padding:10px 4px;font-size:12.5px;min-width:0}
.hudT{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0;margin-top:8px}
.tools{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px;max-width:520px}
.tools .mi.tl{flex-direction:column;justify-content:center;gap:2px;padding:6px 1px 5px;border-radius:10px;font:500 9.5px/1.15 var(--body);position:relative;min-width:0;pointer-events:auto;letter-spacing:-.1px}
.tools .mi.tl .ic{width:19px;height:19px}.tools .mi.tl span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tools .mi.tl .badge{position:absolute;top:1px;right:2px;margin:0;padding:2px 4px;font-size:9px}
@media (max-width:600px){.tools{grid-template-columns:repeat(4,1fr)}.tools .mi.tl{flex-direction:row;gap:5px;padding:7px 3px;font-size:11px;letter-spacing:0;border-radius:11px}.tools .mi.tl .ic{width:17px;height:17px}.tools .mi.tl span{overflow:visible}}
.mi{flex:none;display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;font:500 13px var(--body);white-space:nowrap;touch-action:manipulation}
.mi .ic{width:18px;height:18px}
[hidden]{display:none!important}
.extHud{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 54px);max-width:640px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.extHud>*{pointer-events:auto}
.cap{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.cap h2{margin:0 0 4px;font:700 15px/1.2 var(--display);color:var(--gold)}
.cap p{margin:0;font-size:13px;line-height:1.55;max-width:65ch}
.views{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.views::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;font:500 13px var(--body);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1a1206;font-weight:600}
.panel{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(6,4,3,.55)}
.pcard{width:min(560px,100%);max-height:84%;display:flex;flex-direction:column;background:var(--glass2);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:14px 16px max(14px,env(safe-area-inset-bottom,0px))}
.pcard>header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.pcard h2{margin:0;font:700 19px var(--display);color:var(--gold)}
.x{background:none;border:1px solid var(--line);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1}
#pbody{overflow-y:auto;overscroll-behavior:contain;min-width:0}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(224,176,76,.14)}
.row:last-child{border-bottom:0}
.row .g{flex:1;min-width:0}
.row b{display:block;font:600 14px var(--body)}
.row small{display:block;font:400 12px var(--body);color:var(--mist)}
.go{font:600 13px var(--body);background:var(--gold);color:#1a1206;border:0;border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.go[disabled]{opacity:.4;cursor:default}
.ghost{font:500 13px var(--body);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.ghost[aria-pressed="true"]{background:var(--gold);color:#1a1206;border-color:var(--gold)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 8px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);cursor:pointer;min-width:0}
.tile[disabled]{opacity:.45;cursor:default}
.tile b{font:600 14px var(--body)}
.tile small{font:400 12px var(--body);color:var(--mist)}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.tabs::-webkit-scrollbar{display:none}
.field{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px}
.field label{font:500 12px var(--body);color:var(--mist)}
.field input[type=text]{font:500 15px var(--body);color:var(--paper);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.lines{text-align:center;display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow:hidden;margin:6px 0 10px;mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
.lines p{margin:0;font:400 15px/1.4 var(--body);color:rgba(243,233,210,.45)}
.lines p.on{font:700 18px/1.4 var(--display);color:var(--gold)}
.big{display:block;margin:6px auto;width:110px;height:84px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;border:0;background:radial-gradient(circle at 40% 30%,#d68a4a,#8a4a22);cursor:pointer;box-shadow:0 6px 0 #4a2410;touch-action:manipulation}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #4a2410}
.center{text-align:center}
.cnt{font:700 26px var(--display);font-variant-numeric:tabular-nums}
.note{margin:10px 0 0;font:400 11px/1.5 var(--body);color:var(--mist)}
.breath{width:150px;height:150px;margin:10px auto;border-radius:50%;background:radial-gradient(circle,rgba(255,230,170,.9),rgba(224,176,76,.25) 60%,transparent 70%);animation:br 8s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.55);opacity:.6}50%{transform:scale(1);opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 110px);transform:translateX(-50%) translateY(6px);opacity:0;transition:opacity .3s,transform .3s;background:var(--glass2);border:1px solid var(--line);padding:9px 16px;border-radius:999px;font:500 14px var(--body);pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.ripple{position:fixed;left:50%;top:46%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:2px solid var(--gold);pointer-events:none;opacity:0;z-index:30}
.ripple.go{animation:rip 1.4s ease-out}
@keyframes rip{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(14)}}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
body[data-view="1"] .acts,body[data-view="1"] .menu,body[data-view="1"] .tools,body[data-view="1"] .online,body[data-view="1"] .ticker,body[data-view="1"] #joy,body[data-view="1"] #interact,body[data-view="1"] #sitBtn{display:none}
body[data-view="1"] .tname{display:block}

.chantBar{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top,0px)) + 244px);display:flex;gap:8px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px;font:500 12px var(--body);z-index:2;white-space:nowrap}
.chantBar .ghost{padding:3px 10px;font-size:12px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:35;overflow:hidden}
.fxf{position:absolute;inset:0;animation:fxf 1.1s ease-out forwards}
@keyframes fxf{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.fxp{position:absolute;top:-30px;width:16px;height:22px;border-radius:70% 70% 70% 70%/90% 90% 40% 40%;background:linear-gradient(160deg,#fff0f4,#f08aa8);opacity:.9;animation:fxp 4s linear forwards}
@keyframes fxp{0%{top:-30px;margin-left:0}100%{top:105%;margin-left:var(--dx,0)}}
.fxb{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;animation:fxb 2.5s ease-out forwards}
@keyframes fxb{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-30deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1.15)}}
.fxt{font:700 18px var(--display);color:#ffe3a0;text-shadow:0 2px 8px #000}
.tube{display:block;margin:4px auto;transform-origin:50% 90%}
.tube.shk{animation:shk .16s linear infinite}
@keyframes shk{0%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(7deg) translateY(-4px)}100%{transform:rotate(-7deg) translateY(0)}}
.stkout{height:190px;display:grid;place-items:center}
.stickCard{width:70px;height:170px;border-radius:6px;background:linear-gradient(#f3d898,#d9a845);border:2px solid #8a5a20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#5a2410;animation:stk .9s ease-out}
.stickCard b{font:700 30px var(--display)}.stickCard span{font:600 11px var(--body);writing-mode:horizontal-tb}
@keyframes stk{0%{transform:translateY(80px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.blocks{display:flex;gap:16px;justify-content:center;margin:10px 0}
.blk{display:block;width:46px;height:26px;border-radius:50% 50% 14% 14%/90% 90% 10% 10%;background:linear-gradient(#e8a060,#a8501e);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.blocks.f-th .blk:nth-child(1){animation:fl1 .9s ease-out forwards}.blocks.f-th .blk:nth-child(2){animation:fl2 .9s ease-out forwards}
.blocks.f-am .blk{animation:fl2 .9s ease-out forwards}.blocks.f-du .blk{animation:fl1 .9s ease-out forwards}
@keyframes fl1{0%{transform:translateY(-60px) rotate(0)}60%{transform:translateY(0) rotate(540deg)}100%{transform:translateY(0) rotate(720deg)}}
@keyframes fl2{0%{transform:translateY(-60px) rotate(0)}60%{transform:translateY(0) rotate(540deg)}100%{transform:translateY(0) rotate(900deg) scaleY(-1)}}
@media (prefers-reduced-motion:reduce){.tube.shk,.stickCard,.fxb,.fxp,.blk{animation:none}}
@media (max-height:800px){.acts{gap:4px}.act{padding:5px 2px 4px;font-size:10.5px}}
@media (max-height:640px){.acts{display:grid;grid-template-columns:repeat(2,56px);grid-template-rows:repeat(4,auto);grid-auto-flow:column;gap:4px}.act{width:56px;padding:4px 2px 3px;font-size:10px}}

#joy{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(max(70px,env(safe-area-inset-bottom,0px) + 62px));width:112px;height:112px;border-radius:50%;background:rgba(22,14,11,.45);border:1px solid var(--line);touch-action:none;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:auto}
#joyK{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d27a,#b98428);box-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none}
#interact{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(70px,env(safe-area-inset-bottom,0px) + 62px) + 105px);z-index:6;font:700 15px var(--body);background:var(--gold);color:#1a1206;border:0;border-radius:999px;padding:12px 22px;box-shadow:0 4px 18px rgba(224,176,76,.45);cursor:pointer;animation:pulseI 1.6s ease-in-out infinite;pointer-events:auto;max-width:86vw}
@keyframes pulseI{50%{box-shadow:0 4px 26px rgba(224,176,76,.8)}}
#sitBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 66px);z-index:6;pointer-events:auto;padding:11px 24px;font:700 15px var(--body);color:#2a1706;background:linear-gradient(180deg,#f7dc8a,#d08a2a);border:1px solid #fff0b8;box-shadow:0 6px 20px rgba(0,0,0,.45),0 0 16px rgba(255,200,100,.35)}#sitBtn[hidden]{display:none}
body.inlogin #sitBtn{left:auto;transform:none}
body[data-view="1"] #jumpBtn,body.inlogin #sitBtn{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(max(70px,env(safe-area-inset-bottom,0px) + 62px));z-index:5;pointer-events:auto}
.zname{font:600 12px var(--body);color:var(--gold);letter-spacing:.04em;text-transform:uppercase}
body.inlogin .ui,body.inlogin #joy{display:none}
#fade{position:fixed;inset:0;background:#0a0605;opacity:0;pointer-events:none;transition:opacity .26s;z-index:60}
#fade.on{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){#interact{animation:none}}
@media (prefers-reduced-motion:reduce){.ripple.go{animation:none}.breath{animation:none}.toast{transition:none}}
</style>

ật Đa cố,","đắc A Nậu Đa La Tam Miệu Tam Bồ Đề.","Cố tri Bát Nhã Ba La Mật Đa,","thị đại thần chú, thị đại minh chú,","thị vô thượng chú, thị vô đẳng đẳng chú,","năng trừ nhất thiết khổ, chân thật bất hư.","Cố thuyết Bát Nhã Ba La Mật Đa chú,","tức thuyết chú viết:","Yết đế yết đế, Ba la yết đế,","Ba la tăng yết đế, Bồ đề tát bà ha."]},{n:"Chú Vãng Sanh",lines:["Nam mô A Di Đa Bà Dạ, Đa tha già đa dạ, Đa điệt dạ tha,","A di rị đô bà tỳ, A di rị đa, Tất đam bà tỳ,","A di rị đa, Tỳ ca lan đế, A di rị đa, Tỳ ca lan đa,","Già di nị, Già già na, Chỉ đa ca lệ, Ta bà ha."]},{n:"Kệ Hồi Hướng",lines:["Nguyện đem công đức này,","Hướng về khắp tất cả,","Đệ tử và chúng sinh,","Đều trọn thành Phật đạo."]}],XAM=[["Gió thuận thuyền xuôi","Thượng cát","Việc bạn bền bỉ làm lâu nay sắp có kết quả. Giữ lòng đều, đừng vội và đừng nản."],["Nước lặng thấy đáy","Trung cát","Chuyện đang rối sẽ rõ dần nếu bạn dừng lại một nhịp. Hỏi người đáng tin trước khi quyết."],["Mây tan trăng sáng","Thượng cát","Nỗi lo kéo dài sẽ nhẹ đi. Bạn đã chịu đựng đủ lâu, hãy cho mình nghỉ ngơi xứng đáng."],["Một bước một hoa sen","Trung cát","Đừng nhìn quá xa. Làm tốt việc trước mắt hôm nay, đường sẽ tự mở."],["Cây non đợi mưa","Bình","Chưa phải lúc gặt hái. Hãy chăm gốc rễ: sức khỏe, kỹ năng, những mối quan hệ tử tế."],["Nghe nhiều nói ít","Trung cát","Một lời hấp tấp dễ để lại hối tiếc. Tuần này lắng nghe sẽ có lợi hơn tranh luận."],["Đèn nhỏ cũng soi đường","Thượng cát","Việc bạn cho là nhỏ lại giúp được người khác nhiều hơn bạn nghĩ. Cứ làm đều tay."],["Gặp người hiền","Trung cát","Có người sẵn sàng giúp nếu bạn mở lời. Đừng ngại nhờ vả đúng chỗ."],["Chậm mà chắc","Bình","Tiến độ chậm không phải là thất bại. Soát lại kế hoạch, bỏ bớt việc không cần."],["Buông bớt gánh nặng","Bình","Bạn đang ôm quá nhiều thứ. Chọn một việc để buông xuống, lòng sẽ nhẹ ngay."],["Mùa mới đang đến","Thượng cát","Một khởi đầu mới đang chờ. Chuẩn bị kỹ rồi bắt tay vào làm, đừng chờ hoàn hảo."],["Giữ lời hứa nhỏ","Trung cát","Uy tín được xây từ những việc nhỏ như đến đúng giờ, trả lời đúng hẹn. Hôm nay bắt đầu lại cũng được."]],QHANG=["Thượng thượng","Thượng cát","Trung cát","Bình","Cần tĩnh tâm"],QTOP=["Tổng quát","Bình an","Công việc","Kinh doanh","Sức khỏe","Gia đạo","Tình duyên","Học hành","Đi xa"],QDET=[[["Vận trình chung đang thuận, nhiều việc nhẹ nhàng hơn bạn nghĩ.",["Làm tiếp việc đang dở, đừng đổi hướng vội","Cảm ơn những người đã giúp bạn"],["Chủ quan, nghĩ mọi việc đã chắc"]],["Mọi việc ở mức bình thường, được cái là ổn định.",["Giữ nhịp sống đều, làm từng việc một","Ghi ra việc quan trọng nhất của tuần"],["Ôm thêm nhiều việc cùng lúc"]],["Giai đoạn này nên chậm lại và gom sức.",["Nghỉ ngơi đủ, sắp xếp lại ưu tiên","Hỏi ý người bạn tin cậy"],["Quyết định lớn khi đang mệt hay nóng giận"]]],[["Tâm đang khá vững, bình an đến từ những việc nhỏ hằng ngày.",["Dành 10 phút ngồi yên, theo hơi thở","Chia sẻ niềm vui với người thân"],["So sánh mình với người khác"]],["Lòng có lúc yên, lúc gợn. Đó là điều bình thường.",["Đi bộ chậm, tụng hay nghe một bài kinh ngắn","Viết ra điều đang lo, rồi chọn một việc làm được hôm nay"],["Lo trước những chuyện chưa xảy ra"]],["Bạn đang mang nhiều áp lực, cần chăm sóc tâm mình trước.",["Hít thở sâu, uống nước, ngủ sớm","Nói chuyện với một người bạn tin cậy"],["Ở một mình quá lâu với nỗi lo","Tự trách mình quá nặng"]]],[["Công việc có cơ hội tốt, nỗ lực lâu nay bắt đầu được thấy.",["Chủ động nhận việc bạn làm được tốt","Báo cáo rõ ràng tiến độ cho cấp trên"],["Hứa quá khả năng để làm vừa lòng mọi người"]],["Công việc đều đều, chưa có đột phá nhưng không có trở ngại lớn.",["Học thêm một kỹ năng nhỏ","Dọn lại việc tồn, hoàn tất việc dở"],["Bỏ ngang vì thấy chậm"]],["Công việc đang nhiều áp lực hoặc va chạm, nên thận trọng.",["Kiểm tra lại kế hoạch trước khi làm tiếp","Giữ lời nói ôn hòa với đồng nghiệp"],["Nộp đơn nghỉ hay tranh cãi khi đang nóng giận"]]],[["Thời điểm tương đối thuận để làm việc đã tính kỹ. Đây là nhắc nhở tinh thần, không phải lời khuyên đầ N.orders[n.order.id]=n.order,DON.order=n.order,donQR()):donOrderUpdate(n.order))},Net.on.paid=function(){Net.send({t:"pay_credit"})};var DON_APPLIED={};function payBoot(){serverPay()?(Net.send({t:"pay_credit"}),Net.send({t:"don_get"})):Net.watchClaims&&Net.watchClaims(onClaims)}Net.on.pay_credit=function(n){var t=[];(n.items||[]).forEach(function(n){t.push(n.id),DON_APPLIED[n.id]||(DON_APPLIED[n.id]=1,applyPaid(n,!1))}),t.length&&Net.send({t:"pay_ack",ids:t})};var LIFE=[{t:"Đản sinh",s:"Vườn Lâm Tỳ Ni",p:["Thái tử Tất Đạt Đa (Siddhattha Gotama) sinh ra trong dòng họ Thích Ca (Sakya) ở vùng chân núi Himalaya, nay thuộc Nepal. Cha là vua Tịnh Phạn (Suddhodana), mẹ là hoàng hậu Ma Da (Maya). Theo truyền thống, ngài chào đời trong vườn Lâm Tỳ Ni (Lumbini) khi hoàng hậu trên đường về quê mẹ.","Bảy ngày sau, hoàng hậu Ma Da qua đời. Thái tử được dì là bà Ma Ha Ba Xà Ba Đề (Mahapajapati) nuôi dưỡng. Truyền thuyết kể ngài bước bảy bước, mỗi bước một đóa sen nở; đó là hình ảnh biểu tượng cho khả năng vượt lên sáu nẻo luân hồi của một bậc giác ngộ.","Phật giáo Việt Nam kỷ niệm ngày Đản sinh vào rằm tháng Tư âm lịch (Đại lễ Phật đản, quốc tế gọi là Vesak)."],k:["Lâm Tỳ Ni (Lumbini) là một trong bốn thánh địa lớn của Phật giáo","Dòng họ Thích Ca; cha là vua Tịnh Phạn","Lễ Phật đản: rằm tháng Tư âm lịch"]},{t:"Xuất gia",s:"Rời hoàng cung",p:["Lớn lên trong nhung lụa, thái tử kết hôn với công nữ Da Du Đà La (Yasodhara) và có con trai là La Hầu La (Rahula). Dù được che chở kỹ lưỡng, ngài vẫn băn khoăn trước những câu hỏi về cuộc sống.","Theo kinh điển, trong những lần dạo ra bốn cửa thành, ngài lần lượt thấy người già, người bệnh, người chết và một vị tu sĩ thanh thản. Ba cảnh đầu cho ngài thấy khổ đau của kiếp người, cảnh sau gợi một lối đi tìm sự giải thoát.","Năm 29 tuổi (theo truyền thống), ngài lặng lẽ rời cung cùng người đánh xe Xa Nặc (Channa) và con ngựa Kiền Trắc (Kanthaka). Đến bên bờ sông A Nô Ma, ngài cắt tóc, trao lại y phục và châu báu rồi bắt đầu đời sống xuất gia."],k:["Bốn cảnh: già, bệnh, chết và vị tu sĩ","Rời cung năm 29 tuổi theo truyền thống","Con trai ngài là La Hầu La, sau này cũng xuất gia"]},{t:"Tu khổ hạnh",s:"Sáu năm tìm đạo",p:["Ngài tìm đến hai vị đạo sư nổi tiếng là Alara Kalama và Uddaka Ramaputta, học và đạt những tầng thiền định rất cao, nhưng nhận ra các tầng thiền ấy chưa chấm dứt được khổ đau nên rời đi.","Cùng năm người bạn tu do ngài Kiều Trần Như (Kondanna) dẫn đầu, ngài thực hành khổ hạnh bên sông Ni Liên Thiền (Neranjara) trong khoảng sáu năm, nhịn ăn đến thân thể gầy kiệt.","Rồi ngài nhận ra việc hành hạ thân xác không dẫn tới trí tuệ. Ngài nhận bát cháo sữa do cô gái Tu Xà Đa (Sujata) dâng, hồi sức và chọn con đường Trung đạo: không đắm say hưởng thụ, cũng không cực đoan khổ hạnh. Năm người bạn tu thất vọng và rời đi."],k:["Học thiền với hai đạo sư rồi tự mình tìm tiếp","Sáu năm khổ hạnh bên sông Ni Liên Thiền","Khám phá ra con đường Trung đạo"]},{t:"Thành đạo",s:"Dưới cội bồ đề",p:["Sau khi hồi sức, ngài đến ngồi dưới gốc cây bồ đề ở Bồ Đề Đạo Tràng (Bodh Gaya), phát nguyện không đứng dậy cho đến khi tìm ra chân lý. Kinh điển mô tả những cám dỗ và nỗi sợ hãi xuất hiện trong đêm thiền định như là hình ảnh của Ma vương; ngài đưa tay chạm đất làm chứng, đó là thế ấn 'hàng ma'.","Trong đêm ấy, theo truyền thống, ngài lần lượt chứng được ba minh: nhớ lại các đời trước, thấy rõ sự vận hành của nghiệp và luân hồi, rồi đoạn trừ mọi lậu hoặc. Khi sao mai mọc, ngài thành bậc Giác ngộ (Buddha) ở tuổi 35 theo truyền thống.","Phật giáo Việt Nam kỷ niệm ngày Thành đạo vào mùng 8 tháng Chạp âm lịch."],k:["Nơi thành đạo: Bồ Đề Đạo Tràng","'Buddha' nghĩa là bậc tỉnh thức, giác ngộ","Lễ Thành đạo: mùng 8 tháng Chạp âm lịch"]},{t:"Chuyển pháp luân",s:"Vườn Lộc Uyển",p:["Sau thành đạo, ngài đi đến vườn Lộc Uyển (Sarnath) gần thành Ba La Nại (Varanasi) để gặp lại năm người bạn tu cũ. Tại đây, ngài giảng bài pháp đầu tiên, gọi là Chuyển pháp luân, nghĩa là quay bánh xe chánh pháp.","Nội dung cốt lõi là Trung đạo, Tứ diệu đế (Khổ, Tập, Diệt, Đạo) và Bát chánh đạo. Ngài Kiều Trần Như nghe xong đã thấy được pháp nhãn thanh tịnh, trở thành đệ tử đầu tiên; rồi bốn vị còn lại cũng lần lượt chứng ngộ. Tăng đoàn (Sangha) hình thành từ đó.","Hình bánh xe tám nan trong các chùa chính là biểu tượng của Bát chánh đạo, và đôi nai quỳ hai bên bánh xe nhắc về vườn Lộc Uyển (vườn nai)."],k:["Bài pháp đầu tiên cho năm vị Kiều Trần Như","Tăng đoàn ra đời","Bánh xe pháp tám nan = Bát chánh đạo"]},{t:"Hoằng pháp",s:"Bốn mươi lăm năm",p:["Trong khoảng bốn mươi lăm năm, Đức Phật đi bộ khắp vùng đồng bằng sông Hằng, dạy cho mọi tầng lớp: vua chúa, thương nhân, nông dân, người bị xem là hạ tiện; ngài không phân biệt đẳng cấp mà đón nhận tất cả những ai muốn học.","Các đệ tử nổi tiếng gồm Xá Lợi Phất (trí tuệ bậc nhất), Mục Kiền Liên (thần thông bậc nhất), A Nan (đa văn bậc nhất), Ca Diếp (hạnh đầu đà bậc nhất). Vua Tần Bà Sa La cúng dường Trúc Lâm tinh xá ở Vương Xá, trưởng giả Cấp Cô Độc cúng dường Kỳ Viên tinh xá ở Xá Vệ.","Ngài cũng cho phép nữ giới xuất gia, thành lập ni đoàn đầu tiên với bà Ma Ha Ba Xà Ba Đề. Lời dạy của ngài được các đệ tử ghi nhớ, truyền khẩu rồi chép lại thành Tam tạng kinh điển: Kinh, Luật, Luận."],k:["Dạy mọi tầng lớp, không phân biệt đẳng cấp","Trúc Lâm tinh xá và Kỳ Viên tinh xá","Lời dạy được tập hợp thành Tam tạng"]},{t:"Nhập Niết bàn",s:"Rừng sa la Câu Thi Na",p:["Ở tuổi 80, trên đường đi cuối cùng, Đức Phật nhận bữa cúng dường của người thợ rèn Thuần Đà (Cunda) rồi lâm bệnh. Ngài tiếp tục đi đến Câu Thi Na (Kushinagar) và nằm nghiêng bên phải giữa hai cây sa la, đầu hướng về phương bắc.","Những lời cuối của ngài dành cho các đệ tử: hãy tự thắp đuốc lên mà đi, lấy chánh pháp làm nơi nương tựa, và 'các pháp hữu vi đều vô thường, hãy tinh tấn, đừng buông lung'. Rồi ngài nhập Niết bàn (Parinirvana).","Sau lễ trà tỳ, xá lợi của ngài được chia thành tám phần cho các nước thờ phụng. Phật giáo Việt Nam kỷ niệm ngày Niết bàn vào rằm tháng Hai âm lịch."],k:["Nhập Niết bàn ở Câu Thi Na năm 80 tuổi","'Hãy tự thắp đuốc lên mà đi'","Lễ Niết bàn: rằm tháng Hai âm lịch"]}],BUD=[{t:"Thích Ca Mâu Ni",s:"Đức Phật lịch sử",p:["'Thích Ca' là tên dòng họ, 'Mâu Ni' nghĩa là bậc tịch mặc, hiền giả; vì vậy 'Thích Ca Mâu Ni' có thể hiểu là bậc hiền giả của dòng họ Thích Ca. Đây là Đức Phật bằng xương bằng thịt đã sống ở Ấn Độ cổ đại và sáng lập đạo Phật.","Trong chính điện, tượng Thích Ca thường ở chính giữa, tay có thể bắt ấn thiền định hoặc ấn xúc địa. Phật tử niệm danh hiệu 'Nam mô Bổn sư Thích Ca Mâu Ni Phật', trong đó 'Bổn sư' nghĩa là vị thầy gốc."],k:["Các ngày lễ: Đản sinh 15/4, Thành đạo 8/12, Niết bàn 15/2 (âm lịch)","Bổn sư của đạo Phật"]},{t:"A Di Đà",s:"Phật Vô Lượng Quang, Vô Lượng Thọ",p:["Theo kinh Đại thừa, A Di Đà (Amitabha) là vị Phật của cõi Tây phương Cực Lạc. Danh hiệu có nghĩa là ánh sáng vô lượng và thọ mạng vô lượng. Kinh kể rằng khi còn là Tỳ kheo Pháp Tạng, ngài đã phát bốn mươi tám đại nguyện để tiếp dẫn chúng sinh.","Pháp môn Tịnh độ khuyên người tu niệm danh hiệu 'Nam mô A Di Đà Phật' với lòng tin và nguyện vãng sinh. Đây là pháp môn phổ biến nhất trong Phật giáo Việt Nam; câu 'A Di Đà Phật' cũng là lời chào hỏi quen thuộc giữa các Phật tử."],k:["Ngày vía: 17 tháng 11 âm lịch","Hai vị Bồ Tát hầu cận: Quan Thế Âm và Đại Thế Chí"]},{t:"Dược Sư",s:"Phật Lưu Ly Quang",p:["Dược Sư Lưu Ly Quang Như Lai (Bhaisajyaguru) là vị Phật của cõi Đông phương Tịnh Lưu Ly. Kinh Dược Sư kể về mười hai đại nguyện của ngài, trong đó có nguyện giúp chúng sinh thoát khỏi bệnh tật, nghèo khó và có thân tâm lành mạnh.","Người ta thường tụng kinh Dược Sư để cầu cho người bệnh được an ổn. Điều quan trọng cần nhớ là đây là sự cầu nguyện và tạo thiện duyên, không thay thế cho việc đi khám và chữa bệnh."],k:["Ngày vía: 30 tháng 9 âm lịch","Mười hai đại nguyện"]},{t:"Di Lặc",s:"Vị Phật của tương lai",p:["Di Lặc (Maitreya) nghĩa là Từ Thị, người có tâm từ. Theo kinh điển, ngài hiện là vị Bồ Tát trên cõi trời Đâu Suất và sẽ xuất hiện làm vị Phật kế tiếp trong tương lai xa.","Hình ảnh Di Lặc bụng to, mặt cười tươi, cầm túi vải mà nhiều người thấy ở các chùa là hình tượng dân gian phổ biến ở Trung Hoa, xuất phát từ vị thiền sư Bố Đại; nó mang ý nghĩa vui vẻ, rộng lượng và buông xả."],k:["Ngày vía: mùng 1 tháng Giêng âm lịch","Phật vị lai, biểu tượng của từ bi"]},{t:"Quan Thế Âm",s:"Bồ Tát Đại Từ Đại Bi",p:["Quan Thế Âm (Avalokitesvara) nghĩa là vị lắng nghe tiếng kêu của thế gian. Phẩm Phổ Môn trong kinh Pháp Hoa kể ngài hiện thân nhiều hình tướng để cứu giúp chúng sinh trong lúc khó khăn.","Trong dân gian Việt Nam, Bồ Tát thường được thờ dưới hình tượng Phật Bà áo trắng, tay cầm cành dương liễu và bình cam lộ. Có ba ngày vía trong năm: 19/2 (đản sinh), 19/6 (thành đạo), 19/9 (xuất gia) âm lịch."],k:["Biểu tượng của lòng từ bi","Tay cầm nhành dương liễu và bình cam lộ"]},{t:"Địa Tạng Vương",s:"Bồ Tát Đại Nguyện",p:["Địa Tạng (Ksitigarbha) nổi tiếng với đại nguyện: 'Địa ngục chưa trống, thề không thành Phật; chúng sinh độ hết, mới chứng Bồ đề'. Kinh Địa Tạng Bản Nguyện kể ngài từng là cô gái hiếu thảo, nguyện cứu mẹ và tất cả chúng sinh đau khổ.","Ngài thường được thể hiện với mũ tỳ lô, tay cầm tích trượng và hạt minh châu. Kinh này thường được tụng vào mùa Vu Lan, tháng Bảy âm lịch, để hồi hướng cho người thân đã mất."],k:["Ngày vía: 30 tháng 7 âm lịch","Đại nguyện và lòng hiếu thảo"]},{t:"Văn Thù Sư Lợi",s:"Bồ Tát Trí Tuệ",p:["Văn Thù (Manjusri) là biểu tượng của trí tuệ bát nhã. Ngài thường cưỡi sư tử xanh, tay phải cầm kiếm trí tuệ để chặt đứt vô minh, tay trái cầm quyển kinh Bát Nhã.","Trong bộ ba Hoa Nghiêm Tam Thánh, Văn Thù đứng bên trái và Phổ Hiền bên phải của Đức Phật Thích Ca; trí tuệ và hạnh nguyện luôn đi cùng nhau."],k:["Ngày vía: 4 tháng 4 âm lịch","Cưỡi sư tử xanh, cầm kiếm trí tuệ"]},{t:"Phổ Hiền",s:"Bồ Tát Hạnh Nguyện",p:["Phổ Hiền (Samantabhadra) tượng trưng cho hạnh nguyện rộng lớn: biến những lý tưởng thành việc làm cụ thể. Ngài cưỡi voi trắng sáu ngà, mỗi ngà tượng trưng cho một ba la mật.","Kinh Hoa Nghiêm nêu Mười đại hạnh nguyện của ngài: lễ kính chư Phật, xưng tán Như Lai, rộng tu cúng dường, sám hối nghiệp chướng, tùy hỷ công đức, thỉnh chuyển pháp luân, thỉnh Phật trụ thế, thường theo học Phật, hằng thuận chúng sinh, và hồi hướng khắp cả."],k:["Ngày vía: 21 tháng 2 âm lịch","Mười đại hạnh nguyện"]}],TEA=[{t:"Tứ diệu đế",s:"Bốn sự thật cao quý",p:["Khổ đế: đời sống có những nỗi khổ như sinh, già, bệnh, chết, xa người thương, gặp điều không ưa, cầu mà không được. Tập đế: nguyên nhân của khổ là sự ham muốn, bám víu và vô minh.","Diệt đế: khổ có thể chấm dứt, trạng thái ấy gọi là Niết bàn. Đạo đế: con đường dẫn đến sự chấm dứt khổ, chính là Bát chánh đạo. Đức Phật thường được ví như một thầy thuốc: chẩn đoán bệnh, tìm nguyên nhân, xác nhận có thể chữa lành và kê toa."],k:["Khổ, Tập, Diệt, Đạo","Bài pháp đầu tiên ở Lộc Uyển"]},{t:"Bát chánh đạo",s:"Tám con đường chân chính",p:["Tám chi phần gồm: Chánh kiến (thấy đúng), Chánh tư duy (nghĩ đúng), Chánh ngữ (nói đúng), Chánh nghiệp (hành động đúng), Chánh mạng (nuôi sống chân chính), Chánh tinh tấn (nỗ lực đúng), Chánh niệm (tỉnh thức), Chánh định (thiền định).","Có thể chia thành ba nhóm: Tuệ (Chánh kiến, Chánh tư duy), Giới (Chánh ngữ, Chánh nghiệp, Chánh mạng), Định (Chánh tinh tấn, Chánh niệm, Chánh định). Ba nhóm này hỗ trợ lẫn nhau như ba chân của một cái kiềng."],k:["Giới - Định - Tuệ","Biểu tượng là bánh xe tám nan"]},{t:"Ngũ giới",s:"Năm điều giữ gìn của người tại gia",p:["Năm giới là: không sát sinh, không trộm cắp, không tà dâm, không nói dối, không uống rượu và các chất gây nghiện. Người giữ giới tự nguyện thực hành để tâm mình an ổn và không gây hại cho người khác.","Mỗi giới đều có mặt tích cực: không sát sinh nuôi dưỡng lòng từ, không trộm cắp nuôi dưỡng sự biết đủ và hào phóng, không nói dối nuôi dưỡng sự chân thật, không uống rượu nuôi dưỡng sự tỉnh táo."],k:["Thọ giới là tự nguyện","Bát quan trai là tám giới giữ trong một ngày một đêm"]},{t:"Tam bảo",s:"Phật - Pháp - Tăng",p:["Tam bảo gồm Phật (b tại tinh xá Kỳ Viên cho trưởng lão Xá Lợi Phất, mô tả cõi Cực Lạc ở phương Tây của Đức Phật A Di Đà, nơi không có khổ đau và chúng sinh nhất tâm tu học.","Kinh là một trong những nền tảng của pháp môn Tịnh độ. Người tu niệm danh hiệu “Nam mô A Di Đà Phật” với lòng chuyên nhất, nguyện được sinh về cõi lành. Trong chùa Việt, pháp niệm Phật rất phổ biến và thường đi cùng thiền định."],k:["Nói tại Kỳ Viên cho Xá Lợi Phất","Cõi Cực Lạc ở phương Tây","Nền tảng của pháp môn Tịnh độ"]},{t:"Phẩm Phổ Môn",s:"Quán Thế Âm nghe tiếng kêu cứu",p:["Phẩm Phổ Môn là phẩm thứ hai mươi lăm trong Kinh Pháp Hoa (bản dịch của ngài Cưu Ma La Thập). Phẩm nói về Bồ Tát Quán Thế Âm, vị “quan sát âm thanh của thế gian”, luôn lắng nghe tiếng khổ đau và ứng hiện giúp đỡ.","Kinh kể Bồ Tát hiện nhiều thân khác nhau tùy người cần, thường nói là ba mươi ba thân ứng hóa. Hình ảnh ấy nhắc ta rằng lòng từ bi là biết lắng nghe và giúp người đúng cách. Vì vậy tượng Quan Âm được thờ rộng rãi trong chùa và nhà dân."],k:["Phẩm 25 của Kinh Pháp Hoa","Quán Thế Âm: lắng nghe tiếng khổ của thế gian","Ba mươi ba thân ứng hóa theo truyền thống"]},{t:"Kinh Vu Lan báo hiếu",s:"Mục Kiền Liên cứu mẹ",p:["Kinh kể tôn giả Mục Kiền Liên, đệ tử thần thông bậc nhất của Đức Phật, dùng thiên nhãn thấy mẹ mình chịu khổ ở cõi ngạ quỷ. Ngài cầu xin Phật chỉ cách cứu mẹ.","Đức Phật dạy hãy nương nhờ sức chung của chư Tăng sau ba tháng an cư, vào ngày Tự tứ rằm tháng Bảy, để cúng dường và hồi hướng. Từ đó có lễ Vu Lan báo hiếu. Phong tục cài hoa hồng lên áo, hồng đỏ cho người còn mẹ, hồng trắng cho người mất mẹ, được phổ biến ở Việt Nam từ thế kỷ hai mươi, gắn với thiền sư Thích Nhất Hạnh."],k:["Nhân vật chính: Mục Kiền Liên","Ngày lễ: rằm tháng Bảy, cũng là ngày Tự tứ","Cốt lõi là hiếu hạnh và hồi hướng"]}],LIB_V=[{t:"Phật giáo đến Việt Nam",s:"Luy Lâu và những dấu chân đầu tiên",p:["Theo sử liệu, đạo Phật đến nước ta rất sớm, khoảng những thế kỷ đầu Công nguyên, qua cả đường biển từ Ấn Độ và đường bộ từ Trung Hoa. Luy Lâu (vùng Thuận Thành, Bắc Ninh ngày nay) là trung tâm Phật giáo sớm nhất được nhắc đến.","Tại đây có các vị tăng như Khâu Đà La, Ma Ha Kỳ Vực và học giả Mâu Tử với tác phẩm “Lý hoặc luận”. Dấu tích còn lại là hệ thống chùa Dâu và truyền thuyết Phật Mẫu Man Nương gắn với tín ngưỡng dân gian."],k:["Phật giáo vào Việt Nam khoảng đầu Công nguyên","Luy Lâu (Bắc Ninh) là trung tâm sớm nhất","Hòa quyện với tín ngưỡng bản địa"]},{t:"Thời Lý",s:"Từ chùa Cổ Pháp đến Thăng Long",p:["Triều Lý (1009–1225) là thời Phật giáo hưng thịnh. Vua Lý Công Uẩn thuở nhỏ được sư Lý Khánh Văn nuôi dạy ở chùa Cổ Pháp, sau này lên ngôi và dời đô về Thăng Long năm 1010 với sự ủng hộ của thiền sư Vạn Hạnh.","Nhiều ngôi chùa nổi tiếng ra đời trong thời kỳ này, trong đó có chùa Một Cột (Diên Hựu) dựng năm 1049 dưới triều Lý Thái Tông, kiến trúc hình đóa sen nở trên mặt nước."],k:["Lý Công Uẩn lớn lên ở chùa Cổ Pháp","Dời đô về Thăng Long năm 1010","Chùa Một Cột dựng năm 1049"]},{t:"Thiền phái Trúc Lâm",s:"Vua Trần Nhân Tông trên núi Yên Tử",p:["Sau khi cùng quân dân đánh thắng quân Nguyên Mông, vua Trần Nhân Tông nhường ngôi, đến năm 1299 xuất gia tu hành trên núi Yên Tử và sáng lập thiền phái Trúc Lâm, thiền phái mang bản sắc riêng của Việt Nam.","Ba vị tổ của dòng thiền là Trần Nhân Tông (Điều Ngự Giác Hoàng), Pháp Loa và Huyền Quang. Bài phú “Cư trần lạc đạo” của vua Trần Nhân Tông nhắc rằng có thể sống giữa đời thường mà vẫn vui với đạo."],k:["Sáng lập năm 1299 trên núi Yên Tử","Tam tổ: Trần Nhân Tông, Pháp Loa, Huyền Quang","“Cư trần lạc đạo”: sống giữa đời, vui với đạo"]},{t:"Các truyền thống ngày nay",s:"Bắc tông, Nam tông, Khất sĩ",p:["Phật giáo Việt Nam hiện có ba dòng lớn. Bắc tông (Đại thừa) phổ biến nhất, gồm Thiền, Tịnh độ và Mật tông hòa quyện. Nam tông (Theravada) chủ yếu trong cộng đồng người Khmer ở Nam Bộ và một số nơi khác. Khất sĩ do Tổ sư Minh Đăng Quang khai sáng năm 1946, các vị mặc y vàng và đi khất thực.","Dù khác nhau về nghi lễ và kinh điển, các dòng đều thờ Đức Phật Thích Ca và lấy Tam bảo, Tứ diệu đế, Bát chánh đạo làm nền tảng. Nhiều chùa Việt có sự hòa hợp giữa Thiền và Tịnh độ."],k:["Bắc tông là dòng chính","Nam tông (Theravada) phổ biến trong người Khmer","Khất sĩ khai sáng năm 1946"]},{t:"Thiền sư Thích Nhất Hạnh",s:"Chánh niệm trong đời sống",p:["Thiền sư Thích Nhất Hạnh (1926–2022) sinh ở Huế, xuất gia từ nhỏ tại chùa Từ Hiếu. Ông là một trong những người đưa thiền chánh niệm và Phật giáo dấn thân đến nhiều nước trên thế giới, lập đạo tràng Làng Mai ở Pháp.","Lời dạy của ông rất giản dị: thở vào, biết mình đang thở vào; thở ra, biết mình đang thở ra. Ông khuyến khích đi, đứng, ăn, uống trong chánh niệm và nhìn sâu để hiểu và thương. Ông viên tịch tại chùa Từ Hiếu năm 2022."],k:["1926–2022, xuất gia tại chùa Từ Hiếu (Huế)","Sáng lập Làng Mai (Plum Village) ở Pháp","Chánh niệm: sống tỉnh thức trong hiện tại"]}],LIB_N=[{t:"Mùng một và ngày rằm",s:"Nếp đi chùa của người Việt",p:["Mùng một (sóc) và ngày rằm (vọng) là hai ngày mỗi tháng nhiều người đi chùa lễ Phật, ăn chay, làm việc thiện. Nhịp theo vòng trăng như vậy giúp người ta nhắc mình thường xuyên sống tử tế.","Không cần cầu kỳ: một nén hương, một bó hoa, vài phút tĩnh lặng. Điều quan trọng là tâm mình có thanh tịnh và biết làm việc lành sau khi rời chùa hay không."],k:["Sóc là mùng một, vọng là ngày rằm","Ăn chay, làm việc thiện, tĩnh tâm","Hình thức giản dị, tâm thành là chính"]},{t:"Bốn ngày đại lễ",s:"Đản sinh, Xuất gia, Thành đạo, Niết bàn",p:["Theo truyền thống Phật giáo Việt Nam, bốn dấu mốc lớn của đời Đức Phật được kỷ niệm hằng năm: Xuất gia mùng 8 tháng Hai, Niết bàn rằm tháng Hai, Đản sinh rằm tháng Tư, Thành đạo mùng 8 tháng Chạp (âm lịch).","Ngoài ra còn có lễ Vu Lan rằm tháng Bảy và các ngày vía Bồ Tát như Quán Thế Âm. Ngày Phật đản còn được Liên Hợp Quốc ghi nhận với tên gọi Vesak."],k:["Xuất gia: mùng 8 tháng Hai","Niết bàn: rằm tháng Hai","Đản sinh: rằm tháng Tư, Thành đạo: mùng 8 tháng Chạp"]},{t:"Phép tắc khi đi chùa",s:"Mặc, nói, đi, đứng sao cho đẹp",p:["Khi đi chùa nên mặc quần áo kín đáo, giản dị; nói nhỏ, đi nhẹ; không chụp ảnh ở nơi có biển cấm; xếp giày dép gọn gàng; tắt hoặc để chuông điện thoại ở chế độ im lặng.","Khi dâng hương, giữ hương bằng hai tay, không dùng miệng thổi tắt lửa. Tiền cúng dường để vào hòm công đức, không đặt lên tượng hay bàn thờ. Rác mang đi, giữ chùa sạch như giữ lòng mình."],k:["Ăn mặc kín đáo, nói nhỏ, đi nhẹ","Cúng dường bỏ vào hòm công đức","Giữ chùa sạch, không xả rác"]},{t:"Chuông, mõ, trống, khánh",s:"Những pháp khí của buổi công phu",p:["Chuông và trống dùng để báo giờ và đánh thức tâm. Chuông thường được thỉnh vào sáng sớm và chiều tối; tiếng chuông ngân dài nhắc người nghe dừng lại, thở sâu và buông bớt lo toan.","Mõ thường tạc hình con cá vì cá ngủ cũng mở mắt, nhắc người tu luôn tỉnh thức và tinh tấn. Tiếng mõ giữ nhịp cho cả đại chúng tụng kinh. Khánh là chiếc chuông nhỏ hình bát, đánh để chuyển đoạn và báo hiệu."],k:["Chuông thức tỉnh, trống báo giờ","Mõ cá: cá luôn mở mắt, nhắc tinh tấn","Khánh dùng để chuyển đoạn khi tụng"]},{t:"Ăn chay và phóng sinh",s:"Từ bi bắt đầu từ bữa cơm",p:["Ăn chay xuất phát từ tinh thần không sát sinh và lòng thương các loài vật. Nhiều Phật tử ăn chay ngày mùng một, ngày rằm hoặc những ngày trong tháng. Ăn chay không cần cầu kỳ, quan trọng là cân bằng dinh dưỡng và bền lâu.","Phóng sinh đúng cách là cứu và thả các loài bản địa về đúng môi trường sống, không mua bán, bắt nhốt rồi thả, vì như vậy vô tình gây thêm sát hại và hại hệ sinh thái. Trong game, phóng sinh cá ở ao sen là một hoạt động mang tính tượng trưng."],k:["Ăn chay xuất phát từ giới không sát sinh","Phóng sinh đúng cách: thả loài bản địa về đúng nơi","Không mua bán rồi thả, tránh hại hệ sinh thái"]}],LIB_W=[{t:"Thiền theo dõi hơi thở",s:"Bài tập năm phút cho người mới",p:["Ngồi thẳng lưng thoải mái, tay đặt trên đùi, mắt khép hờ hoặc nhìn xuống. Chú tâm vào hơi thở vào và ra ở mũi hoặc bụng. Khi tâm trôi đi, chỉ cần nhẹ nhàng đưa trở lại hơi thở, không trách mình.","Bắt đầu năm phút mỗi ngày, tăng dần theo sức. Trong game, bạn có thể bấm nút Thiền để ngồi yên và cảm nhận nhịp thở. Thiền không phải để không nghĩ gì, mà là học cách nhận biết suy nghĩ mà không bị cuốn theo."],k:["Ngồi thẳng, thả lỏng, theo dõi hơi thở","Tâm trôi thì nhẹ nhàng đưa về, đừng trách mình","Bắt đầu bằng năm phút mỗi ngày"]},{t:"Thiền hành và ăn chánh niệm",s:"Đi và ăn cũng là tu tập",p:["Thiền hành là đi chậm, cảm nhận bàn chân chạm đất, phối hợp với hơi thở. Có thể đi trong sân chùa hoặc ngay trong nhà. Khi đi, không cần đi đến đâu, mỗi bước là một nơi đã đến.","Ăn chánh niệm là ăn chậm, nhìn thức ăn, nhai kỹ, biết ơn người làm ra bữa ăn. Cách ăn này giúp bớt ăn quá mức, bớt vội vã, và biến một việc quen thuộc thành bài tập sống tỉnh thức."],k:["Thiền hành: đi chậm, theo dõi bước chân","Ăn chánh niệm: chậm, kỹ, biết ơn","Bất kỳ việc gì cũng có thể làm trong tỉnh thức"]},{t:"Thiền và võ Thiếu Lâm",s:"Rèn thân để an tâm",p:["Theo truyền thống, Tổ sư Bồ Đề Đạt Ma đến Thiếu Lâm Tự trên núi Tung Sơn (Trung Quốc) khoảng thế kỷ thứ năm hoặc sáu và truyền Thiền tông. Võ Thiếu Lâm về sau gắn với việc rèn sức khỏe và ý chí cho người tu.","Nhiều chi tiết lịch sử về võ Thiếu Lâm là truyền thuyết, nhưng tinh thần cốt lõi nhất quán: võ để tự vệ, rèn thân, tĩnh tâm, không để hơn thua. Ở võ đường trong chùa này, bạn có thể thử bài “Luyện công” để cảm nhận nhịp thở và sự tập trung."],k:["Tung Sơn là nơi có Thiếu Lâm Tự","Nhiều chi tiết là truyền thuyết","Võ để rèn thân tâm, không để hơn thua"]},{t:"Võ đức",s:"Học lễ trước, học võ sau",p:["Nhiều võ phái cổ truyền Việt Nam đề cao võ đức, tức đạo đức người luyện võ: tôn kính thầy, khiêm nhường, không dùng võ để bắt nạt, giữ chữ tín và biết giúp người yếu.","Tinh thần ấy rất gần với giới của người tu: không gây hại, nói lời hòa nhã, kiên trì tinh tấn. Người luyện lâu năm thường nhận ra điều khó nhất không phải đòn thế mà là làm chủ chính mình."],k:["Võ đức: khiêm nhường, kính thầy, giúp người yếu","Gần với tinh thần giới luật của người tu","Khó nhất là làm chủ chính mình"]},{t:"Lục độ và Lục hòa",s:"Sáu phương tiện và sáu cách sống chung",p:["Lục độ ba la mật gồm bố thí, trì giới, nhẫn nhục, tinh tấn, thiền định, trí tuệ: sáu việc giúp con người từ bờ khổ sang bờ an lạc. Mỗi độ có thể tập từ việc nhỏ như cho đi, giữ lời, nhẫn nại.","Lục hòa là sáu nguyên tắc để tập thể chung sống hòa thuận: thân hòa đồng trụ, khẩu hòa vô tranh, ý hòa đồng duyệt, giới hòa đồng tu, kiến hòa đồng giải, lợi hòa đồng quân. Cộng đồng nào áp dụng được sẽ rất bình an."],k:["Lục độ: bố thí, trì giới, nhẫn nhục, tinh tấn, thiền định, trí tuệ","Lục hòa: sáu nguyên tắc sống chung hòa thuận","Tập từ việc nhỏ hằng ngày"]}],LIB_S=[{t:"Hạt cải của Kisa Gotami",s:"Nỗi mất mát không của riêng ai",p:["Kisa Gotami mất đứa con nhỏ, đau đớn bế xác con đi khắp nơi xin thuốc cứu. Có người chỉ cô đến gặp Đức Phật. Ngài bảo cô đi xin một hạt cải từ gia đình chưa từng có người qua đời.","Cô đi hết nhà này đến nhà khác và nhận ra không gia đình nào thoát khỏi mất mát. Hiểu ra điều ấy, nỗi đau của cô dịu lại và cô xin xuất gia. Câu chuyện dạy rằng vô thường là quy luật chung và biết sẻ chia giúp bớt cô đơn trong nỗi đau."],k:["Vô thường là quy luật của mọi gia đình","Hiểu điều ấy giúp nỗi đau dịu lại","Sẻ chia làm bớt cô đơn"]},{t:"Vô Não (Angulimala)",s:"Kẻ hung dữ cũng có thể quay đầu",p:["Angulimala (Vô Não) là tên cướp khét tiếng, đeo vòng ngón tay của những người bị hại. Khi hắn đuổi theo Đức Phật, Ngài vẫn bước đều và nói: “Ta đã dừng lại từ lâu, chính ngươi mới là người chưa dừng.”","Nghe vậy, hắn buông vũ khí, xin xuất gia và sau đó tu tập tinh tấn. Câu chuyện nhắc rằng ai cũng có khả năng chuyển hóa. Tuy vậy, nó không có nghĩa là hậu quả của việc đã làm sẽ biến mất."],k:["Ai cũng có thể quay đầu","“Dừng lại” là dừng tâm tham sân","Quay đầu vẫn phải gánh trách nhiệm"]},{t:"Chăm sóc người bệnh",s:"“Ai chăm sóc người bệnh là chăm sóc ta”",p:["Trong Luật tạng có kể một vị tỳ kheo bị bệnh nặng, nằm trong phân và nước tiểu mà không ai chăm sóc. Đức Phật cùng tôn giả A Nan đến, tự tay tắm rửa, thay y và đặt vị ấy nằm nơi sạch sẽ.","Sau đó Ngài dạy các tỳ kheo: nếu các ông muốn chăm sóc ta thì hãy chăm sóc người bệnh. Lời dạy ấy nhắc rằng lòng từ bi thể hiện bằng việc làm cụ thể, nhất là với người yếu đuối và bị bỏ rơi."],k:["Phật tự tay chăm sóc vị tỳ kheo bệnh","Chăm sóc người bệnh là hạnh được tôn trọng","Từ bi cần được thể hiện bằng việc làm"]},{t:"Mũi tên thứ hai",s:"Đau là một, khổ thêm là do mình",p:["Kinh “Mũi tên” kể rằng người bình thường khi bị một mũi tên đau đớn ập đến sẽ than khóc, giận dữ, lo sợ, như bị bắn thêm mũi tên thứ hai. Còn người tu tập chỉ chịu mũi tên thứ nhất.","Nghĩa là đau đớn thân thể hay mất mát là điều khó tránh, còn nỗi khổ thêm vào do phản ứng của tâm thì ta có thể bớt đi. Thở sâu, quan sát cảm giác và không để suy nghĩ phóng đại là cách tập."],k:["Mũi tên thứ nhất: sự việc xảy ra","Mũi tên thứ hai: khổ do phản ứng của tâm","Thở sâu, quan sát, đừng phóng đại"]},{t:"Kinh Kalama",s:"Đừng tin chỉ vì ai cũng nói vậy",p:["Người dân Kalama hỏi Đức Phật nên tin ai khi có nhiều vị thầy dạy khác nhau. Ngài khuyên đừng tin chỉ vì nghe nhiều người nói, vì truyền thống, vì kinh sách hay vì đó là lời của thầy.","Hãy tự quan sát: điều gì khi làm khiến tham, sân, si tăng lên và gây hại thì bỏ; điều gì mang lại lợi ích, an vui cho mình và người thì nên tu. Tinh thần này khuyến khích sự kiểm chứng và trải nghiệm, không tin mù quáng."],k:["Đừng tin chỉ vì truyền thống hay số đông","Tự kiểm chứng điều gì có lợi, điều gì có hại","Tinh thần thực nghiệm của đạo Phật"]}];LIBGROUPS.push(["k","Kinh điển thường tụng",LIB_K,"Năm bản kinh quen thuộc trong chùa Việt"],["v","Phật giáo Việt Nam",LIB_V,"Từ Luy Lâu đến Làng Mai"],["n","Nghi lễ và lễ hội",LIB_N,"Nếp đi chùa, ngày lễ, pháp khí"],["w","Thiền, võ và sống tỉnh thức",LIB_W,"Thực hành nhẹ nhàng mỗi ngày"],["s","Truyện Phật và lời dạy",LIB_S,"Năm câu chuyện, năm bài học"]),LIB_TOTAL=0,LIBGROUPS.forEach(function(n){LIB_TOTAL+=n[2].length}),function(){function n(n,t,e,a){QZ.push([n,t,e,a])}n("Chùa Một Cột (Diên Hựu) được dựng dưới triều vua nào?","Lý Thái Tông",["Trần Thái Tông","Lê Thánh Tông","Lý Nhân Tông"],"Chùa dựng năm 1049 dưới triều Lý Thái Tông, kiến trúc như đóa sen nở trên mặt nước."),n("Vua Lý Công Uẩn thuở nhỏ lớn lên ở chùa nào?","Chùa Cổ Pháp",["Chùa Hương","Chùa Dâu","Chùa Bái Đính"],"Ngài được sư Lý Khánh Văn nuôi dạy ở chùa Cổ Pháp (Bắc Ninh)."),n("Trung tâm Phật giáo sớm nhất của nước ta thời Bắc thuộc là?","Luy Lâu",["Hoa Lư","Cổ Loa","Thăng Long"],"Luy Lâu (Thuận Thành, Bắc Ninh) là trung tâm Phật giáo sớm, nổi tiếng với chùa Dâu."),n("Thiền phái Trúc Lâm gắn với ngọn núi nào?","Yên Tử",["Ba Vì","Bà Đen","Hoàng Liên Sơn"],"Vua Trần Nhân Tông tu hành trên núi Yên Tử và sáng lập thiền phái Trúc Lâm."),n("Tam tổ Trúc Lâm gồm Trần Nhân Tông, Pháp Loa và ai?","Huyền Quang",["Vạn Hạnh","Khuông Việt","Tuệ Trung"],"Ba vị tổ là Điều Ngự Giác Hoàng Trần Nhân Tông, Pháp Loa và Huyền Quang."),n("Thiền sư Thích Nhất Hạnh sáng lập đạo tràng nổi tiếng nào ở Pháp?","Làng Mai",["Núi Yên Tử","Chùa Từ Hiếu","Thiền viện Trúc Lâm"],"Làng Mai (Plum Village) là nơi thực tập chánh niệm của ông ở Pháp."),n("Dòng Phật giáo Khất sĩ do ai khai sáng?","Tổ sư Minh Đăng Quang",["Hòa thượng Thích Trí Quang","Thiền sư Vạn Hạnh","Thiền sư Khuông Việt"],"Tổ sư Minh Đăng Quang khai sáng hệ phái Khất sĩ vào năm 1946."),n("Phật giáo Việt Nam chủ yếu thuộc truyền thống nào?","Bắc tông (Đại thừa)",["Mật tông Tây Tạng","Chỉ thuộc Nam tông","Thiền Nhật Bản"],"Bắc tông là dòng chính, bên cạnh Nam tông (Theravada) và Khất sĩ."),n("Ngày Đức Phật nhập Niết bàn được kỷ niệm vào ngày nào?","Rằm tháng Hai âm lịch",["Rằm tháng Tư","Mùng 8 tháng Chạp","Rằm tháng Bảy"],"Theo truyền thống Việt Nam, Niết bàn kỷ niệm rằm tháng Hai âm lịch."),n("Ngày Đức Phật xuất gia được kỷ niệm vào ngày nào?","Mùng 8 tháng Hai âm lịch",["Rằm tháng Tư","Rằm tháng Giêng","Mùng 8 tháng Tư"],"Theo truyền thống Việt Nam, lễ Xuất gia vào mùng 8 tháng Hai âm lịch."),n("Câu “sắc tức thị không, không tức thị sắc” có trong kinh nào?","Tâm kinh Bát nhã",["Kinh A Di Đà","Kinh Địa Tạng","Kinh Vu Lan"],"Đây là câu nổi tiếng trong Tâm kinh, nói về tính không, tức các pháp do duyên sinh."),n("Câu “ưng vô sở trụ nhi sinh kỳ tâm” nằm trong kinh nào?","Kinh Kim Cang",["Tâm kinh","Kinh Pháp Hoa","Kinh A Di Đà"],"Theo truyền thống Thiền, Lục tổ Huệ Năng tỉnh ngộ khi nghe câu này trong Kinh Kim Cang."),n("Phẩm Phổ Môn nói về Bồ Tát nào?","Quán Thế Âm",["Văn Thù","Phổ Hiền","Địa Tạng"],"Phẩm Phổ Môn trong Kinh Pháp Hoa nói về Bồ Tát Quán Thế Âm lắng nghe tiếng khổ của chúng sinh."),n("Trong Kinh Vu Lan, ai cứu mẹ thoát cảnh khổ?","Mục Kiền Liên",["A Nan","La Hầu La","Xá Lợi Phất"],"Mục Kiền Liên, đệ tử thần thông bậc nhất, cầu Phật chỉ cách cứu mẹ."),n("Kinh A Di Đà nói về cõi nào?","Cõi Cực Lạc",["Cõi Đâu Suất","Cõi Ta Bà","Cõi Dục giới"],"Kinh mô tả cõi Cực Lạc phương Tây của Đức Phật A Di Đà."),n("Phật giáo Nam tông còn gọi là gì?","Theravada",["Mật tông","Thiền tông","Tịnh độ tông"],"Theravada (Thượng tọa bộ, Trưởng lão bộ) là Phật giáo Nam tông."),n("Kinh điển Nam tông chủ yếu được ghi bằng ngôn ngữ nào?","Pali",["Hán","Tạng","Nhật"],"Tam tạng Pali là bộ kinh điển cổ của truyền thống Theravada."),n("Tam tạng kinh điển gồm Kinh, Luật và gì?","Luận",["Giới","Thiền","Chú"],"Tam tạng gồm Kinh (lời Phật dạy), Luật (giới luật) và Luận (bình giải)."),n("Chuỗi tràng hạt phổ biến nhất có bao nhiêu hạt?","108",["50","99","200"],"108 hạt là phổ biến nhất, ngoài ra còn có chuỗi 54 hoặc 27 hạt."),n("Mõ trong chùa thường được tạc hình con vật nào?","Con cá",["Con rồng","Con rùa","Con hạc"],"Mõ cá nhắc người tu thức tỉnh, vì cá ngủ cũng mở mắt."),n("Vì sao mõ lại tạc hình cá?","Cá ngủ cũng mở mắt, nhắc tinh tấn",["Cá là món ăn quý","Cá bơi nhanh","Cá biết nói"],"Hình ảnh cá luôn mở mắt nhắc người tu luôn tỉnh thức và tinh tấn."),n("Bánh xe pháp tám nan tượng trưng cho điều gì?","Bát chánh đạo",["Tám ngọn núi","Tám vị Bồ Tát","Tám cõi trời"],"Tám nan của bánh xe pháp tượng trưng cho tám chi phần của Bát chánh đạo."),n("Hoa sen mọc từ bùn tượng trưng cho điều gì?","Sống giữa đời mà không nhiễm ô",["Sự giàu có","Mùa xuân","Sức mạnh"],"Sen vươn lên từ bùn nhưng vẫn tinh khiết, như người tu giữa đời vẫn giữ lòng trong sạch."),n("Tượng Phật nhập Niết bàn thường nằm nghiêng về bên nào?","Bên phải",["Bên trái","Nằm ngửa","Nằm sấp"],"Hình ảnh phổ biến là Đức Phật nằm nghiêng bên phải, đầu hướng về phía bắc."),n("Ấn xúc địa (chạm đất) của Đức Phật nhắc đến sự kiện nào?","Thành đạo",["Đản sinh","Nhập Niết bàn","Chuyển pháp luân"],"Ấn xúc địa nhắc việc ngài chạm tay xuống đất, mời đất làm chứng khi thành đạo."),n("Hai bàn tay ngửa chồng nhau đặt trên lòng, ngón cái chạm nhau là ấn gì?","Ấn thiền định",["Ấn xúc địa","Ấn thuyết pháp","Ấn thí nguyện"],"Đây là ấn thiền định, thường thấy ở các tượng Phật ngồi thiền."),n("Chú tiểu trong chùa thường ở bậc tu nào?","Sa di",["Hòa thượng","Cư sĩ","Đại lão"],"Sa di là người xuất gia nam đã thọ mười giới, chưa thọ đại giới tỳ kheo."),n("“Tuổi hạ” của một vị tăng là gì?","Số năm tính từ lúc thọ đại giới",["Tuổi đời","Số năm làm trụ trì","Số chùa đã ở"],"Tuổi hạ tính từ lúc thọ đại giới, thường được đếm theo số mùa an cư."),n("Mùa an cư kiết hạ của chư tăng kéo dài khoảng bao lâu?","Ba tháng",["Một tuần","Một năm","49 ngày"],"Chư tăng ở yên một nơi để tu học trong ba tháng mùa mưa."),n("Ngày Tự tứ cuối mùa an cư trùng với ngày nào?","Rằm tháng Bảy (Vu Lan)",["Rằm tháng Tư","Mùng 8 tháng Chạp","Rằm tháng Giêng"],"Ngày Tự tứ rằm tháng Bảy cũng là ngày lễ Vu Lan."),n("Mùng một và ngày rằm hằng tháng còn được gọi là?","Sóc và vọng",["Sinh và tử","Xuân và thu","Chay và mặn"],"Ngày mùng một gọi là sóc, ngày rằm gọi là vọng."),n("“Chánh niệm” nghĩa là gì?","Sống tỉnh thức với điều đang diễn ra",["Nhớ chuyện cũ","Tụng thật nhiều","Không suy nghĩ gì cả"],"Chánh niệm là biết rõ mình đang làm gì, cảm thấy gì, ngay trong hiện tại."),n("Thiền hành là gì?","Đi chậm với sự chú tâm vào từng bước",["Chạy bộ đường dài","Ngồi tụng kinh","Nhịn ăn"],"Thiền hành là đi chậm, cảm nhận bàn chân chạm đất và hơi thở."),n("Theo truyền thống, ai được xem là sơ tổ Thiền tông Trung Hoa?","Bồ Đề Đạt Ma",["Huyền Trang","Cưu Ma La Thập","Nghĩa Tịnh"],"Truyền thống kể Bồ Đề Đạt Ma mang Thiền đến Trung Hoa, tuy nhiều chi tiết là truyền thuyết."),n("Thiếu Lâm Tự theo truyền thống nằm ở ngọn núi nào?","Tung Sơn",["Phổ Đà","Võ Đang","Nga Mi"],"Thiếu Lâm Tự ở núi Tung Sơn, Trung Quốc."),n("“Võ đức” trong võ cổ truyền nhấn mạnh điều gì?","Khiêm nhường, kính thầy, không bắt nạt",["Thắng mọi đối thủ","Khoe võ công","Giấu nghề"],"Võ đức là đạo đức người luyện võ: khiêm nhường, tôn sư, giúp người yếu."),n("Trong game, bài “Luyện công” ở võ đường giúp rèn điều gì?","Sự tập trung và canh nhịp",["Tốc độ gõ phím","Sức mạnh cơ bắp","Trí nhớ"],"Bạn canh đúng nhịp để xuất chiêu, như tập chú tâm."),n("Vì sao nói “mũi tên thứ hai” trong lời Phật dạy?","Là nỗi khổ thêm do phản ứng của tâm",["Là mũi tên có độc","Là đòn thứ hai của kẻ thù","Là tên một pháp khí"],"Mũi tên thứ nhất là sự việc, mũi tên thứ hai là khổ thêm do mình phản ứng quá mức."),n("Trong truyện hạt cải, Kisa Gotami được dặn đi xin gì?","Một hạt cải từ nhà chưa có ai mất",["Một chén thuốc quý","Một bông sen","Một chiếc áo cà sa"],"Cô nhận ra nhà nào cũng từng có mất mát, nỗi đau vì thế dịu lại."),n("Tên cướp đeo vòng ngón tay người rồi theo Phật xuất gia là?","Vô Não (Angulimala)",["Đề Bà Đạt Đa","Ca Diếp","Ưu Ba Ly"],"Angulimala sau khi gặp Phật đã buông dao và xin xuất gia."),n("Kinh Kalama khuyên điều gì?","Tự kiểm chứng, không tin mù quáng",["Tin tuyệt đối vào thầy","Tin theo số đông","Không cần học hỏi"],"Đức Phật khuyên quan sát điều gì có lợi, điều gì có hại rồi tự mình quyết định."),n("Đệ tử được xem là trì giới bậc nhất là ai?","Ưu Ba Ly",["A Nan","Tu Bồ Đề","La Hầu La"],"Ưu Ba Ly là vị nổi tiếng về trì giới, ngài thuật lại Luật tạng ở kỳ kết tập đầu tiên."),n("Đệ tử được xem là giải không bậc nhất là ai?","Tu Bồ Đề",["Ca Diếp","Mục Kiền Liên","A Nan"],"Tu Bồ Đề là người đối thoại với Đức Phật trong Kinh Kim Cang."),n("Đệ tử được xem là hạnh đầu đà bậc nhất là ai?","Đại Ca Diếp",["Xá Lợi Phất","Phú Lâu Na","Ưu Ba Ly"],"Đại Ca Diếp nổi tiếng giữ hạnh đầu đà, sống giản dị và nghiêm cẩn."),n("Đệ tử được xem là thần thông bậc nhất là ai?","Mục Kiền Liên",["A Nan","Tu Bồ Đề","Ca Diếp"],"Mục Kiền Liên nổi tiếng thần thông, và gắn với tích Vu Lan báo hiếu."),n("Bốn thánh địa Phật tích gồm Lâm Tỳ Ni, Bồ Đề Đạo Tràng, Câu Thi Na và?","Lộc Uyển (Sarnath)",["Vương Xá","Xá Vệ","Tỳ Xá Ly"],"Bốn nơi là đản sinh, thành đạo, chuyển pháp luân (Lộc Uyển) và nhập Niết bàn."),n("Vị hoàng đế Ấn Độ hộ trì Phật giáo, dựng nhiều trụ đá chỉ dụ là ai?","A Dục (Ashoka)",["Tần Bà Sa La","Ba Tư Nặc","Tịnh Phạn"],"Vua A Dục sau khi quy y đã chủ trương trị nước bằng đạo đức và hộ trì Phật giáo."),n("“Hồi hướng” trong Phật giáo nghĩa là gì?","Chia sẻ phước lành cho tất cả chúng sinh",["Quay về nhà","Trả nợ nghiệp","Cầu giàu sang"],"Sau khi làm việc lành hay tụng kinh, người ta nguyện chia sẻ công đức đến mọi loài."),n("Phóng sinh đúng cách là?","Thả loài bản địa đúng môi trường sống",["Mua thật nhiều rồi thả","Thả loài ngoại lai","Thả vào hồ nhân tạo bất kỳ"],"Cần tránh mua bán, bắt nhốt rồi thả, vì dễ gây thêm sát hại và ảnh hưởng hệ sinh thái."),n("Lễ cầu siêu nhằm mục đích gì?","Hồi hướng cầu cho người đã khuất được an lành",["Xin tài lộc","Xem bói","Mừng sinh nhật"],"Cầu siêu là nghi lễ tụng kinh hồi hướng cho người đã mất."),n("Bồ đề tâm là gì?","Tâm nguyện giác ngộ để giúp chúng sinh",["Quả của cây bồ đề","Một loại thiền","Tên một ngôi chùa"],"Bồ đề tâm là tâm nguyện tu tập đến giác ngộ vì lợi ích của tất cả chúng sinh."),n("Tam tạng Kinh, Luật, Luận: phần nào ghi lời Phật dạy trực tiếp?","Kinh",["Luật","Luận","Chú"],"Kinh ghi lại lời Phật dạy, Luật ghi giới luật, Luận là phần bình giải của các học giả."),n("Lục hòa dạy điều gì?","Cách sống chung hòa thuận",["Sáu cách ăn chay","Sáu phép thần thông","Sáu pháp khí"],"Lục hòa là sáu nguyên tắc giúp tập thể hòa hợp: thân, khẩu, ý, giới, kiến, lợi hòa."),n("Phật Dược Sư thường được nhắc ở cõi nào?","Tịnh Lưu Ly phương Đông",["Cực Lạc phương Tây","Đâu Suất","Ta Bà"],"Phật Dược Sư ở cõi Tịnh Lưu Ly phương Đông, còn Phật A Di Đà ở Cực Lạc phương Tây."),n("Ngày vía Địa Tạng Bồ Tát thường nhắc vào dịp nào?","Ngày 30 tháng Bảy âm lịch",["Mùng 1 Tết","Rằm tháng Tư","19 tháng 2"],"Nhiều chùa Việt làm lễ vía Địa Tạng vào ngày 30 tháng Bảy âm lịch.")}();var ADV_TOPICS=[{k:"lo",n:"Lo âu, bồn chồn",s:"Khi đầu óc cứ chạy mãi",a:["Lo âu thường sống ở tương lai. Hãy đặt tay lên bụng, thở ra thật dài, rồi tự hỏi: ngay lúc này, mình có đang an toàn không? Việc gì làm được hôm nay thì làm, việc chưa tới thì để mai.","Viết điều lo ra giấy, tách thành hai cột: việc mình làm được và việc mình không làm được. Với cột thứ nhất, chọn một bước nhỏ. Với cột thứ hai, tập buông từng chút.","Khi đầu óc rối, hãy đi bộ chậm và đếm bước chân. Bước một, bước hai... Tâm theo bước chân thì bớt chạy theo suy nghĩ."]},{k:"gian",n:"Giận dữ, nóng nảy",s:"Khi lòng như lửa",a:["Cơn giận như chén nước đục: để yên một lúc là lắng. Đừng nói, đừng nhắn tin, đừng quyết định gì khi đang giận. Hít vào ba hơi dài rồi hãy trả lời.","Hãy hỏi mình: điều này năm năm nữa còn quan trọng không? Nếu không, bớt một phần giận. Nếu có, hãy nói chuyện khi đã bình tĩnh, nói về việc chứ không nói về con người.","Giận là tín hiệu có điều gì đó chạm vào mình: sự tôn trọng, sự công bằng, sự mệt mỏi. Gọi đúng tên điều đó, rồi nói ra bằng lời dịu, thường có ích hơn nói ra bằng lời gắt."]},{k:"gd",n:"Gia đình, người thân",s:"Hiểu nhau, bớt trách nhau",a:["Người thân hay làm ta đau nhất vì ta thương họ nhiều nhất. Trước khi trách, thử kể lại điều mình mong muốn thay vì điều họ làm sai. Một câu như “con mong được mẹ nghe con nói hết” dễ vào lòng hơn một lời trách.","Với cha mẹ lớn tuổi, đôi khi họ không cần lời khuyên, chỉ cần có người ngồi cạnh. Một bữa cơm, một cuộc gọi ngắn, một lời hỏi “hôm nay mẹ khỏe không” cũng là báo hiếu.","Trong gia đình, ai cũng đang làm điều họ cho là tốt nhất với những gì họ biết. Hiểu điều đó không có nghĩa là đồng ý, nhưng giúp ta bớt cay đắng khi trò chuyện."]},{k:"hoc",n:"Học hành, thi cử",s:"Giữ tâm vững khi áp lực",a:["Học theo nhịp: học thật tập trung ít phút rồi nghỉ một chút, thay vì ngồi nhiều giờ mà đầu óc trôi đi. Ngủ đủ giúp nhớ lâu hơn thức khuya học thêm.","Trước kỳ thi, lo là bình thường. Hãy chuẩn bị điều mình chuẩn bị được, còn kết quả để lại cho hôm đó. Ngồi vào bàn thi, thở ba hơi rồi làm câu dễ trước.","Điểm số chỉ nói về một lần làm bài, không nói hết về con người bạn. Điều ở lại lâu nhất là thói quen chăm chỉ và biết hỏi khi chưa hiểu."]},{k:"viec",n:"Công việc, tiền bạc",s:"Làm việc mà không mất mình",a:["Làm việc chăm chỉ là tốt, nhưng đừng để công việc nuốt hết thời gian cho bản thân và người thân. Hãy đặt một giờ cố định mỗi ngày không nhìn điện thoại công việc.","Với tiền bạc, “biết đủ” là một phần của giàu. Ghi lại khoản chi trong một tuần, bạn sẽ thấy mình đang sống vì điều gì. Rồi quyết định có chủ ý thay vì chạy theo thói quen.","Khi gặp đồng nghiệp khó, thử nhìn họ như một người cũng đang vất vả. Bạn không cần thích họ, chỉ cần giữ lời nói tử tế và ranh giới rõ ràng."]},{k:"mat",n:"Mất mát, nỗi buồn",s:"Khi có người đã rời đi",a:["Nỗi buồn mất người thương không phải điều để vượt qua thật nhanh. Cho phép mình khóc, nhớ, kể lại về người ấy. Thời gian không xóa nỗi nhớ, chỉ làm nó nhẹ dần.","Hãy làm một việc nhỏ nhân danh người đã đi: thắp nén hương, nấu món họ thích, làm một việc thiện. Tình thương không mất đi, nó đổi chỗ để ở trong ta.","Nếu nỗi buồn kéo dài và khiến bạn không ăn ngủ được, hãy nói với một người thân hoặc người có chuyên môn. Chia sẻ không phải là yếu đuối."]},{k:"co",n:"Cô đơn, thiếu động lực",s:"Khi thấy mình lạc lõng",a:["Cô đơn đôi khi không phải vì thiếu người, mà vì thiếu người hiểu mình. Hãy thử một nhóm nhỏ làm cùng một việc: lớp học, đội thiện nguyện, buổi tụng kinh. Quen nhau qua việc chung dễ hơn qua lời chào.","Khi không có động lực, đừng chờ có hứng mới làm. Chọn một việc nhỏ chỉ mất năm phút và làm ngay. Hành động nhỏ thường kéo tâm trạng đi lên.","Hãy chăm bản thân như chăm một người bạn: ăn đúng bữa, ra nắng một chút, dọn lại bàn. Những việc giản dị này đỡ mình hơn mình tưởng."]},{k:"met",n:"Mệt mỏi, kiệt sức",s:"Khi cần nghỉ một chút",a:["Cây cũng cần mùa đông. Cho phép mình nghỉ mà không thấy tội lỗi. Nghỉ là một phần của làm việc bền lâu.","Thử bỏ bớt một việc không thật sự cần. Nói “không” một lần với điều chỉ làm mình thêm mệt thì đỡ hơn gồng thêm nhiều lần.","Ngồi yên năm phút, nhìn một thứ xanh, nghe một âm thanh nhẹ. Không làm gì cũng là một cách hồi sức, đặc biệt khi đầu óc đã quá tải."]}],ADV_NOTE="Lời nhắn của nhân vật ảo, mang tính chia sẻ tinh thần, không thay cho bác sĩ hay chuyên gia. Nếu bạn thấy quá nặng nề hoặc không an toàn, hãy nói ngay với người thân hoặc dịch vụ hỗ trợ tâm lý ở nơi bạn sống.",STORIES=[{t:"Hạt cải trắng",p:["Cô Kisa Gotami mất đứa con nhỏ. Cô ôm con đi từ nhà này sang nhà khác xin thuốc cứu sống. Ai cũng thương nhưng không ai giúp được, cho đến khi có người chỉ cô đến gặp Đức Phật.","Đức Phật nói: “Hãy đi xin một hạt cải trắng ở nhà nào chưa từng có người qua đời, ta sẽ giúp.” Cô đi suốt ngày, gõ cửa hết nhà này đến nhà khác. Nhà nào cũng có người thân đã mất.","Chiều xuống, cô ngồi lại bên đường và hiểu rằng mất mát là điều mọi gia đình đều gặp. Nỗi đau của cô vẫn còn đó, nhưng cô không còn thấy mình đơn độc."],l:"Biết rằng người khác cũng từng đau như mình giúp nỗi buồn bớt nặng và lòng bớt oán trách."},{t:"Món quà không nhận",p:["Có một người đến chửi mắng Đức Phật rất nặng lời. Ngài lặng yên nghe hết, rồi hỏi: “Nếu con mang quà đến tặng một người mà người ấy không nhận, món quà thuộc về ai?”","Người kia đáp: “Thuộc về con.” Đức Phật mỉm cười: “Vậy hôm nay ta không nhận lời của con.”"],l:"Lời nặng nề chỉ làm ta khổ khi ta cầm lấy nó. Không nhận, nó trở về với người mang đến."},{t:"Hai nhà sư và cô gái bên sông",p:["Hai nhà sư đi đường gặp một cô gái không dám lội qua dòng nước chảy xiết. Vị sư lớn tuổi lặng lẽ cõng cô qua sông, rồi đặt xuống và hai thầy trò đi tiếp.","Vị sư trẻ đi sau, bụng cứ khó chịu suốt mấy dặm đường. Cuối cùng chú không nhịn được mà hỏi. Thầy đáp: “Ta đã đặt cô ấy xuống từ bờ sông. Sao con vẫn còn mang cô ấy đi?”"],l:"Điều đã qua thì buông xuống. Mang theo mãi chỉ làm mình mệt."},{t:"Chén trà đã đầy",p:["Một vị giáo sư tìm đến thiền sư để hỏi về thiền. Thiền sư mời trà, rót đầy chén rồi vẫn rót tiếp, nước tràn ra bàn.","Giáo sư hốt hoảng: “Chén đầy rồi, thầy đừng rót nữa!” Thiền sư nói: “Tâm ông cũng như chén này, đầy ý kiến và suy đoán. Ông không làm cạn chén thì tôi biết rót gì vào?”"],l:"Muốn học thêm, trước hết phải biết khiêm tốn và để trống một chỗ trong tâm."},{t:"Ngọn đèn của bà lão nghèo",p:["Một đêm lễ, nhà vua cúng dường hàng ngàn ngọn đèn để Phật và chư tăng đi qua. Gần đó, một bà lão nghèo chỉ có vài đồng, mua được chút dầu, thắp một ngọn đèn nhỏ và ước nguyện thật lòng.","Gió đêm nổi lên, thổi tắt nhiều ngọn đèn của nhà vua. Riêng ngọn đèn nhỏ của bà lão vẫn cháy sáng tới tận sáng."],l:"Giá trị của việc cúng dường nằm ở tấm lòng thanh tịnh, không nằm ở nhiều hay ít."},{t:"Tái ông mất ngựa",p:["Một ông lão ở biên ải có con ngựa quý bị chạy mất. Hàng xóm đến chia buồn, ông chỉ nói: “Biết đâu đó lại là phúc.” Mấy tháng sau ngựa trở về, còn dắt theo một con ngựa hoang tốt.","Hàng xóm đến mừng, ông lại nói: “Biết đâu đó là họa.” Quả nhiên con trai ông cưỡi ngựa hoang bị ngã gãy chân. Một năm sau chiến tranh nổ ra, thanh niên làng đều phải ra trận, riêng con ông vì què chân mà được ở nhà."],l:"May hay rủi nhiều khi chưa thể kết luận ngay. Giữ lòng bình thản, đừng vội mừng quá hay buồn quá."},{t:"Mũi tên thứ hai",p:["Có lần Đức Phật hỏi các đệ tử: “Nếu một người bị mũi tên bắn trúng, rồi bị bắn thêm mũi tên thứ hai vào đúng chỗ ấy, người ấy đau thế nào?” Các vị thưa: “Rất đau ạ.”","Ngài dạy: “Mũi tên thứ nhất là nỗi đau mà cuộc đời mang đến. Mũi tên thứ hai là nỗi khổ do chính ta thêm vào bằng sự trách móc, lo sợ và nghĩ ngợi. Ta không tránh được mũi thứ nhất, nhưng có thể không bắn mũi thứ hai.”"],l:"Gặp chuyện khó, đừng tự bắn thêm mũi tên bằng những suy nghĩ làm mình đau hơn."},{t:"Ăn cơm thì ăn cơm",p:["Có người hỏi một thiền sư: “Thầy tu tập như thế nào?” Thầy đáp: “Đói thì ăn, mệt thì ngủ.” Người kia bảo: “Ai chẳng làm như vậy?”","Thầy nói: “Không giống đâu. Người khác ăn cơm mà nghĩ trăm điều, ngủ mà tính ngàn việc. Còn ta ăn thì chỉ ăn, ngủ thì chỉ ngủ.”"],l:"Sống trọn vẹn trong từng việc đang làm, đó là một cách tu."},{t:"Ương-quật-ma-la",p:["Có một tên cướp hung bạo khiến cả vùng khiếp sợ. Một hôm hắn thấy Đức Phật đi thong thả trên đường, liền rút gươm đuổi theo. Hắn chạy hết sức nhưng không đuổi kịp người đang đi chậm.","Hắn hét lên bảo Ngài dừng lại. Đức Phật quay lại, nói nhẹ nhàng: “Ta đã dừng từ lâu rồi. Chính ngươi mới là người chưa chịu dừng.” Hắn ngẩn người, buông gươm xuống, xin theo Ngài tu tập và dần trở thành một người hiền lành."],l:"Ai cũng có thể dừng lại và đổi hướng, dù quá khứ có thế nào."},{t:"Mục Kiền Liên và mùa Vu Lan",p:["Tôn giả Mục Kiền Liên, đệ tử nổi tiếng về thần thông của Đức Phật, nhớ thương mẹ đã mất. Ngài dùng thần thông tìm mẹ và thấy mẹ đang chịu khổ cảnh đói khát.","Ngài đau lòng xin Phật chỉ cách cứu mẹ. Phật dạy nên nhờ sức chung của chư tăng sau ba tháng an cư, ngày rằm tháng bảy, thành tâm cúng dường. Từ đó có lễ Vu Lan, ngày để mỗi người nhớ ơn cha mẹ."],l:"Hiếu thảo là lúc còn có thể. Một bữa cơm, một lời hỏi han hôm nay quý hơn mọi lễ nghi."},{t:"Vua Trần Nhân Tông và Trúc Lâm",p:["Vua Trần Nhân Tông là vị vua nhà Trần đã cùng quân dân đánh thắng quân Nguyên Mông. Sau khi đất nước yên bình, ngài nhường ngôi cho con và lên núi Yên Tử tu hành.","Ngài sáng lập thiền phái Trúc Lâm của Việt Nam, và để lại câu thơ nổi tiếng về việc sống giữa đời mà vẫn an vui với đạo, gọi là “cư trần lạc đạo”."],l:"Tu không nhất thiết phải rời khỏi đời. Sống giữa việc đời mà giữ được lòng an cũng là tu."},{t:"Chú tiểu và thùng nước rò",p:["Một chú tiểu mỗi sáng gánh hai thùng nước từ giếng về chùa. Một thùng nguyên vẹn, thùng kia bị nứt, nên tới nơi chỉ còn nửa nước. Chú buồn vì thấy mình làm việc không trọn vẹn.","Thầy chỉ cho chú xem: dọc đường phía thùng rò, hoa đã nở thành hàng. “Hằng ngày con đã tưới hoa mà không hay biết.”"],l:"Điều ta cho là thiếu sót vẫn có thể nuôi sống những điều tốt đẹp."},{t:"Cái khay trà bị nứt",p:["Một vị thiền sư có chiếc khay trà đã nứt một đường dài. Khách thấy tiếc bảo thầy nên đổi cái mới. Thầy cười: “Đường nứt ấy là lần ta lỡ tay làm rơi, nhưng nhờ thế mà ta nhớ phải cẩn thận hơn.”","Thầy nói thêm: “Vết nứt này kể lại cả câu chuyện của chiếc khay. Cái mới thì đẹp, nhưng chưa có gì để kể.”"],l:"Những vết nứt trong đời cũng là một phần câu chuyện của ta, không cần che giấu."}],PILG_TALES=[{t:"Chuyến đi bộ lên chùa",p:["Hồi trẻ tôi đi bộ ba ngày từ quê lên chùa ở trên núi. Chân phồng rộp, ba lô nặng, mấy lần định quay về. Mẹ tôi dặn: “Đi chậm mà chắc, con ạ.”","Lên tới nơi, bát cơm chay ở nhà trai ngon hơn mọi bữa tiệc tôi từng ăn. Từ đó tôi hiểu, cái ngon nhiều khi nằm ở chặng đường đã đi."],l:"Đi chậm mà chắc, đến nơi sẽ biết trân trọng."},{t:"Người bán hàng rong",p:["Ngày nào tôi cũng thấy một bác bán hàng rong ở cổng chùa. Bác chẳng giàu có gì, nhưng ai hỏi mua thì bác cũng cười, có lúc còn biếu thêm một trái chuối cho đứa nhỏ.","Hôm tôi hỏi sao bác không tính toán, bác bảo: “Mình cho đi chút xíu mà vui cả ngày, lời quá còn gì.”"],l:"Sự rộng rãi nhỏ bé hằng ngày làm ta giàu có trong lòng."},{t:"Lần đầu tập ngồi thiền",p:["Lần đầu ngồi thiền, tôi chỉ ngồi được vài phút là chân tê, đầu thì nghĩ chuyện công việc, chuyện mai ăn gì. Tôi định bỏ cuộc.","Sư thầy bảo: “Con chỉ cần biết là mình đang nghĩ, rồi nhẹ nhàng quay lại hơi thở. Mỗi lần quay lại là một lần tập.” Từ đó tôi bớt tự trách."],l:"Điều quan trọng không phải là không bị phân tâm, mà là biết nhẹ nhàng quay trở lại."},{t:"Bữa cơm với mẹ",p:["Có một dạo tôi bận rộn, tuần nào cũng hẹn về thăm mẹ mà không về được. Một hôm mẹ gọi, không nói gì khác, chỉ hỏi tôi ăn cơm chưa.","Tôi bỏ hết việc về ngay hôm đó. Mẹ nấu vài món đơn giản mà tôi ăn hết sạch. Đó là bữa cơm nhớ nhất của tôi."],l:"Điều người thân cần nhiều khi chỉ là sự có mặt của mình."},{t:"Cây bồ đề trước sân nhà",p:["Nhà tôi có cây bồ đề ông nội trồng. Có năm bão làm gãy cành, cả nhà tưởng nó chết. Vậy mà mùa xuân năm sau nó lại đâm chồi.","Ông nội dặn: “Cái gì cũng cần thời gian để lành, cây hay người đều vậy.”"],l:"Tổn thương cần thời gian để lành. Cứ chăm sóc và kiên nhẫn."},{t:"Lá thư không gửi",p:["Có lần tôi giận một người bạn rất lâu, giận đến mức viết hẳn một lá thư dài trách móc. Viết xong tôi để đó mấy hôm không gửi.","Đọc lại, tôi thấy có những câu mình viết lúc nóng giận là không đúng. Cuối cùng tôi viết lá thư khác ngắn hơn và gọi điện hòa lại với bạn."],l:"Chờ cho cơn giận lắng xuống rồi hãy nói, ta sẽ ít hối tiếc hơn."}],ADV_KEY="npcN";function npcPay(n,t,e){return rollDaily(),!S.daily[n]&&!((S.daily[ADV_KEY]||0)>=12)&&(S.daily[ADV_KEY]=(S.daily[ADV_KEY]||0)+1,dailyOnce(n,t,e))}var _lastStory=-1;function storyPick(n){var t,e=STORIES.length,a=0;if(n&&Math.random()<.5)return t=Math.random()*PILG_TALES.length|0,{tale:PILG_TALES[t],mine:!0};do{t=Math.random()*e|0,a++}while(t===_lastStory&&a<6);return _lastStory=t,{tale:STORIES[t],mine:!1}}function advFlow(n,t,e,a){n.textContent="";var i=el("p",null,"Bạn đang băn khoăn điều gì? Chọn một chủ đề, mình sẽ chia sẻ vài lời.");function o(i){n.textContent="";var r=Math.random()*i.a.length|0,h=el("h3",null,i.n);h.style.cssText="margin:8px 0 10px;font:600 17px/1.4 var(--head,serif);color:var(--gold)",n.appendChild(h);var l=el("p",null,i.a[r]);l.style.cssText="font:500 15.5px/1.75 var(--body);margin:6px 0 14px",n.appendChild(l);var c=npcPay("npcA"+e,2,0);prog("loikhuyen",1),n.appendChild(el("p","note",c?"Bạn nhận được +2 công đức vì lắng nghe.":"Bạn vẫn có thể xin thêm l
